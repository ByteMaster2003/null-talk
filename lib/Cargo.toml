[package]
name = "lib"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
bincode = "1.3.3"
ssh-key = { version = "0.6", features = ["alloc", "encryption"] }
rsa = { version = "0.9", features = ["sha2"] }
rand = "0.8"
aes-gcm = "0.10"
rpassword = "7.3"
hex.workspace = true
tokio-util.workspace = true
